<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg0: #0f1220;
      --bg1: #161b2e;
      --card: rgba(255,255,255,0.06);
      --card-border: rgba(255,255,255,0.08);
      --text: #e8eaf2;
      --muted: #9aa3b5;
      --accent: #60a5fa;
      --accent2: #a78bfa;
      --danger: #f87171;
      --ok: #22c55e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      max-height: 580px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, var(--bg0) 0%, var(--bg1) 55%, #1a1440 100%);
      color: var(--text);
      padding: 16px;
    }
    .header {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 1.25em;
      letter-spacing: 0.2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .sub {
      margin-top: 4px;
      font-size: 0.72em;
      color: var(--muted);
    }
    .repo-name {
      font-size: 1.05em;
      color: var(--accent);
      margin: 4px 0 8px;
      text-align: center;
      word-break: break-all;
      font-weight: 600;
    }
    .repo-desc {
      font-size: 0.82em;
      color: var(--muted);
      text-align: center;
      line-height: 1.35;
      margin-bottom: 10px;
    }
    .repo-desc.muted { font-style: italic; opacity: 0.85; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
    }
    .stat-value { font-size: 1.15em; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.72em; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.4px; }
    .health-bar {
      height: 7px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      margin: 8px 0;
      overflow: hidden;
    }
    .health-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.45s ease;
    }
    .health-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.8em;
      color: var(--muted);
    }
    .health-value { font-weight: 700; font-size: 1.05em; }
    .health-factors {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .factor-chip {
      font-size: 0.7em;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 3px 8px;
    }
    .factor-chip.muted { color: var(--muted); }
    .section { margin: 14px 0 6px; }
    .section-title {
      font-size: 0.75em;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .lang-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      font-size: 0.82em;
    }
    .lang-name { width: 88px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lang-pct { color: var(--muted); width: 42px; flex-shrink: 0; text-align: right; }
    .bar-container {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: 4px; }
    .contributors {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .contributor {
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.78em;
      display: flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
    }
    .contributor img {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
    }
    #actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }
    #actions[hidden] { display: none !important; }
    .btn {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.88em;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #0b1020;
      font-weight: 700;
    }
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--card-border);
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .loading {
      text-align: center;
      padding: 36px 8px;
      color: var(--muted);
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 12px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.12);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.85em; }
    .error, .empty {
      text-align: center;
      padding: 22px 10px;
    }
    .error-title, .empty-title {
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }
    .error-title { color: var(--danger); }
    .error-msg, .empty-detail, .error-hint {
      font-size: 0.82em;
      color: var(--muted);
      line-height: 1.4;
    }
    .error-hint { margin-top: 10px; }
    .empty-inline {
      color: var(--muted);
      font-size: 0.78em;
      padding: 4px 0;
    }
    .info-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 8px 0 4px;
      font-size: 0.78em;
      color: var(--muted);
    }
    .footer {
      font-size: 0.72em;
      color: var(--muted);
      text-align: center;
      margin-top: 12px;
    }
    .footer a { color: var(--accent); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Repo Analyzer</h1>
    <div class="sub">Local GitHub page analysis · v5.0.0</div>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner" aria-hidden="true"></div>
      <div class="loading-text">Analyzing repository…</div>
    </div>
  </div>

  <div id="actions" hidden>
    <button id="openBtn" class="btn btn-primary" type="button">Open on GitHub</button>
    <button id="copyBtn" class="btn btn-secondary" type="button">Copy JSON</button>
  </div>

  <p class="footer"><a href="https://github.com/Ares16x16" target="_blank" rel="noopener noreferrer">@Ares16x16</a> · no API key required</p>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
